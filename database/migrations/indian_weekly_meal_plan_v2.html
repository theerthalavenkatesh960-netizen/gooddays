  document.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.dt').forEach(b => b.classList.remove('active'));
  document.getElementById('dp-'+idx).classList.add('active');
  btn.classList.add('active');
}

function buildDays() {
  const container = document.getElementById('days-container');
  DAYS.forEach((day, di) => {
    const panel = document.createElement('div');
    panel.className = 'day-panel' + (di===0?' active':'');
    panel.id = 'dp-'+di;

    let html = `<div class="focus-bar"><i class="ti ti-barbell" aria-hidden="true" style="font-size:14px"></i>${day.focus}</div>`;

    day.meals.forEach(meal => {
      const totalCals = meal.p*4 + meal.c*4 + meal.f*9;
      const pPct = Math.round(Math.min((meal.p*4/totalCals)*100, 100));
      const cPct = Math.round(Math.min((meal.c*4/totalCals)*100, 100));
      const fPct = Math.round(Math.min((meal.f*9/totalCals)*100, 100));

      html += `<div class="meal-block">
        <div class="meal-header">
          <div class="meal-dot" style="background:${meal.color}"></div>
          <span class="meal-time">${meal.time}</span>
          <span class="meal-title">${meal.title}</span>
          <span class="meal-kcal">${meal.kcal} kcal</span>
        </div>
        <div class="meal-body">`;

      meal.items.forEach(item => {
        html += `<div class="food-row">
          <span class="food-name">${item.name}</span>
          <span class="food-note">${item.note}</span>
        </div>`;
      });

      html += `<div class="macro-bar" style="margin-top:8px">
        <div class="mb-label"><span>Protein</span><span>${meal.p}g</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pPct}%;background:#378ADD"></div></div>
      </div>
      <div class="macro-bar">
        <div class="mb-label"><span>Carbs</span><span>${meal.c}g</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${cPct}%;background:#639922"></div></div>
      </div>
      <div class="macro-bar">
        <div class="mb-label"><span>Fats</span><span>${meal.f}g</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${fPct}%;background:#EF9F27"></div></div>
      </div>
      </div></div>`;
    });

    html += `<div class="day-summary">
      <div class="ds-card"><div class="ds-val">${day.total.kcal}</div><div class="ds-label">Total kcal</div></div>
      <div class="ds-card"><div class="ds-val">${day.total.p}g</div><div class="ds-label">Protein</div></div>
      <div class="ds-card"><div class="ds-val">${day.total.c}g</div><div class="ds-label">Carbs</div></div>
      <div class="ds-card"><div class="ds-val">${day.total.f}g</div><div class="ds-label">Fats</div></div>
    </div>`;

    panel.innerHTML = html;
    container.appendChild(panel);
  });
}

buildDays();
</script>
