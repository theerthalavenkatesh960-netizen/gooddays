services:
  - type: web
    name: gooddays-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false
      - key: Google__OAuthStateSecret
        sync: false
      - key: Google__RedirectUri
        sync: false
      - key: Google__FrontendRedirectAfterCallback
        sync: false
      - key: Encryption__Key
        sync: false
